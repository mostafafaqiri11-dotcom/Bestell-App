<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/styles/fonts_and_colors.css">
    <script src="script.js"></script>
</head>

<body>
    <header class="site_header">
        <nav class="site_header_nav">
            <nav class="site_header_inline">
                <img class="site_header_logo" src="assets/icons/Logo 02.svg">
                <img class="site_header_menu" src="assets/icons/menu.svg">
            </nav>
        </nav>
        <section class="header_home">
            <img class="header_home_image" src="assets\image\header photo.svg" alt="">
            <img class="header_home_burger_logo" src="assets\image\logo.svg" alt="">
            <div class="header_home_title">
                <div class="header_hoem_home_title_logos">
                    <img class="header_home_title_logos_logo1" src="assets\image\BurgerHouse.svg" alt="">
                    <img class="header_home_title_logos_logo2" src="assets\image\Frame 28.svg" alt="">
                </div>
                <h2 class="header_home_title_text">The best of Burgers, Pizza, and Greens, all in one great
                    place.
                </h2>
            </div>
        </section>
    </header>
    <main class="main">
        <article class="main_article">
            <section class="main_article_menu">
                <div class="main_article_menu_header">
                    <img src="assets/icons/Chanese 1.svg" class="main_article_menu_header_title_logo" alt="">
                    <div class="main_article_menu_header_title_title">
                        <h3>Burger & Sandwiches</h3>
                    </div>
                </div>
                <div class="main_article_menu_content">
                    <div class="main_article_menu_content_slection">
                        <img src="assets/image/Rectangle 10 (11).png" class="main_article_menu_content_slection_image"
                            alt="">
                        <div class="main_article_menu_content_slection_detail">
                            <div class="main_article_menu_content_slection_detail_title">
                                <h4 class="main_article_menu_content_slection_detail_title_title"></h4>
                                <h5 class="main_article_menu_content_slection_detail_title_text"></h5>
                            </div>
                            <div class="main_article_menu_content_slection_detail_price">
                                <h6 class="main_article_menu_content_slection_detail_price_text"></h6>
                                <button class="main_article_menu_content_slection_detail_price_button">
                                </button>
                            </div>
                        </div>
                    </div>

                </div>

            </section>
        </article>
        <aside class="main_aside">

        </aside>

    </main>
    <footer class="footer">
        <div class="footer_container">
            <div class="footer_copyright">
                <img class="icon">
                </img>
                <span class="text">
                </span>
            </div>
            <span class="footer_text"></span>
            <span class="footer_text"></span>
        </div>
    </footer>
</body>

</html>
