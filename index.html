<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestell App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="assets/styles/fonts_and_colors.css">
    <script src="script.js" defer></script>

</head>

<body>
    <header class="site_header">
        <nav class="site_header_nav">
            <nav class="site_header_inline">
                <img class="site_header_logo" src="assets/icons/Logo 02.svg">
                <img class="site_header_menu" src="assets/icons/menu.svg">
            </nav>
        </nav>
        <section class="header_home">
            <img class="header_home_image" src="assets\image\header photo.svg" alt="">
            <img class="header_home_burger_logo" src="assets\image\logo.svg" alt="">
            <div class="header_home_title">
                <div class="header_home_title_logos">
                    <img class="header_home_title_logos_logo1" src="assets\image\BurgerHouse.svg" alt="">
                    <img class="header_home_title_logos_logo2" src="assets\image\Frame 28.svg" alt="">
                </div>
                <h1 class="header_home_title_text">The best of Burgers, Pizza, and Greens, all in one great
                    place.
                </h1>
            </div>
        </section>
    </header>
    <main class="main">
        <article onload="renderTemplate('id')" id="id" class="main_article">

        </article>
        <aside class="main_aside_basket">
            <h4 class="main_aside_basket">
                Your basket
            </h4>
            <div class="main_aside_basket_container">
                <div class="main_aside_basket_container_orders">
                    <h5 class="main_aside_basket_container_orders_title"></h5>
                    <div class="main_aside_basket_container_orders_title_add">
                        <img class="main_aside_basket_container_orders_title_add_img1" src="" alt="">
                        <p class="main_aside_basket_container_orders_title_add_text"></p> 
                        <img class="main_aside_basket_container_orders_title_add_img2" src="" alt="">                        
                    </div>
                    <p></p>
                </div>
                <p class="main_aside_basket_container_subtotal"></p>
                <p class="main_aside_basket_container_deliveryFee"></p>
                <p class="main_aside_basket_container_total"></p>
                <button class="main_aside_basket_container_button"></button>
            </div>
        </aside>
    </main>
    <footer class="footer">
        <div class="footer_container">
            <div class="footer_copyright">
                <img src="assets\icons\copyright.svg" class="icon">
                <span class="text">2026 BurgerHouse</span>
            </div>

            <span class="footer_text">Imprint</span>
            <span class="footer_text">Cookie Preferences</span>
        </div>
    </footer>

    
</body>

</html>
